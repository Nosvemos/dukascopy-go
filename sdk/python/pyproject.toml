[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dukascopy-go"
version = "1.0.0"
description = "Blazing fast Dukascopy market data downloader SDK built on Go"
readme = "../../README.md"
requires-python = ">=3.9"
authors = [
  { name="Nosvemos" }
]
license = { text = "Proprietary Source-Available Non-Commercial License" }
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: Other/Proprietary License",
  "Operating System :: OS Independent",
  "Topic :: Office/Business :: Financial :: Investment",
]

[project.optional-dependencies]
pandas = ["pandas>=1.0.0", "pyarrow>=1.0.0"]

[project.urls]
"Homepage" = "https://github.com/Nosvemos/dukascopy-go"
"Bug Tracker" = "https://github.com/Nosvemos/dukascopy-go/issues"
